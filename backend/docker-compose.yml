name: rpg-manager

services:
  mysql:
    image: mysql:8.4
    container_name: rpg-manager-mysql
    environment:
      MYSQL_DATABASE: rpg_manager
      MYSQL_ROOT_PASSWORD: rpg10
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prpg10"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    container_name: rpg-manager-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_URL: jdbc:mysql://mysql:3306/rpg_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      MYSQL_USER: root
      MYSQL_PASSWORD: rpg10
      APP_EMAIL_ENABLED: "true"
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Defina SMTP_PASSWORD no arquivo .env}
      FRONTEND_BASE_URL: https://degrading-dreamy-antihero.ngrok-free.dev
    ports:
      - "8080:8080"
      - "5173:5173"

  frontend:
    image: node:22-alpine
    container_name: rpg-manager-frontend
    depends_on:
      - backend
    network_mode: "service:backend"
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  mysql-data:
  frontend-node-modules:
